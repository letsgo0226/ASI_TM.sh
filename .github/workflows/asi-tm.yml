name: ASI TM

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [asi-evolve]

permissions:
  contents: read

concurrency:
  group: asi-tm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-liner size and syntax
        run: |
          bytes=$(wc -c < ASI_TM.sh)
          echo "ASI_TM.sh bytes=$bytes"
          test "$bytes" -lt 2048
          bash -n ASI_TM.sh
          chmod +x ASI_TM.sh
      - name: Verify universal s enumeration
        run: |
          ./ASI_TM.sh 8 0
          ./ASI_TM.sh 3 255
          ./ASI_TM.sh 64 1000
      - name: Verify paste-and-run independence
        run: |
          cmd=$(cat ASI_TM.sh)
          cd /tmp
          bash -c "$cmd" -- 8 0
