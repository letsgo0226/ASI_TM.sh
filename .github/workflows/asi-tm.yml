name: ASI TM

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [asi-evolve]

permissions:
  contents: read

concurrency:
  group: asi-tm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-liner size and syntax
        run: |
          bytes=$(wc -c < ASI_TM.sh)
          echo "ASI_TM.sh bytes=$bytes"
          test "$bytes" -lt 2048
          bash -n ASI_TM.sh
          chmod +x ASI_TM.sh
      - name: Verify universal s and self-index fixed point
        run: |
          ./ASI_TM.sh 8 0
          ./ASI_TM.sh 3 255
          out=$(./ASI_TM.sh self)
          echo "$out" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["SELF_SOLVED"] and x["SELF_LEN"]>0 and x["SELF_INDEX"].startswith("0x")'
      - name: Verify paste-and-run independence
        run: |
          cmd=$(cat ASI_TM.sh)
          cd /tmp
          out=$(bash -c "$cmd" -- 1 257)
          echo "$out"
          echo "$out" | grep -q '"SELF_SOLVED":true'
